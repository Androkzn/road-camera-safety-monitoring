[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-safety"
version = "1.0.0"
description = "Live dashcam safety review system — YOLO detection, LLM narration, road analytics"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.40",
    "lapx>=0.5.2",
    "opencv-python>=4.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
    "yt-dlp>=2024.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["road_safety*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
